theme = 'congo'
baseURL = 'https://travels.loganfamily.co.uk/'
locale = 'en-gb'
title = 'Logan Van Travels'
summaryLength = 25

# Posts are ordered/grouped by .Date, so use the trip dates as the page date.
[frontmatter]
  date = ['arrival', 'start_date', ':default']

[taxonomies]
  category = 'category'
  subcategory = 'subcategory'

[permalinks]
  pages = "/:slug/"
