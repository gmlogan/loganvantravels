backend:
  name: github
  repo: gmlogan/loganvantravels
  branch: main

media_folder: ''
public_folder: ''
site_url: https://travels.loganfamily.co.uk

# Sveltia converts uploaded raster images in the browser before saving.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1200   # max width; smaller images aren't upscaled

collections:

  # ---------------------------------------------------------------- Van Trips
  - name: van_aire
    label: "Van Trips: Aire"
    folder: content/posts            # MATCH EXISTING
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"           # MATCH EXISTING (page bundles)
    media_folder: ""                 # MATCH EXISTING (co-located images)
    public_folder: ""
    filter: { field: subcategory, value: aire }
    fields:
      - { label: Category, name: category, widget: hidden, default: van-trips }
      - { label: Subcategory, name: subcategory, widget: hidden, default: aire }
      # shared fields (all post types)
      - &f_title { label: Title, name: title, widget: string }
      - &f_arrival { label: Arrival, name: arrival, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - &f_departure { label: Departure, name: departure, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - &f_body { label: Write-up, name: body, widget: markdown, editor_components: [image, images, code-block] }
      - &f_trip { label: Trip, name: trip, widget: relation, collection: trips, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
      - &f_map { label: Map link, name: map_link, widget: string, required: false }
      - &f_address { label: Address, name: address, widget: string, required: false }
      - &f_country { label: Country, name: country, widget: string, required: false }
      # van fields (shared by all van subcategories)
      - &f_facilities { label: Facilities, name: facilities, widget: select, multiple: true, required: false, options: [Water, Waste, Electric hook-up, Toilets, Showers, Wi-Fi] }
      - &f_cost { label: Cost per night, name: cost_per_night, widget: number, value_type: float, required: false }
      - &f_rating { label: Rating, name: rating, widget: number, value_type: int, min: 1, max: 5, required: false }
      # Aire only
      - { label: Max stay, name: max_stay, widget: string, required: false }

  - name: van_pub
    label: "Van Trips: Pub"
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"
    media_folder: ""
    public_folder: ""
    filter: { field: subcategory, value: pub }
    fields:
      - { label: Category, name: category, widget: hidden, default: van-trips }
      - { label: Subcategory, name: subcategory, widget: hidden, default: pub }
      - *f_title
      - *f_arrival
      - *f_departure
      - *f_body
      - *f_trip
      - *f_map
      - *f_address
      - *f_country
      - *f_facilities
      - *f_cost
      - *f_rating
      # Pub only
      - { label: Stopover allowed, name: stopover_allowed, widget: boolean, default: false }
      - { label: Food rating, name: food_rating, widget: number, value_type: int, min: 1, max: 5, required: false }

  - name: van_ccc
    label: "Van Trips: CCC"
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"
    media_folder: ""
    public_folder: ""
    filter: { field: subcategory, value: ccc }
    fields:
      - { label: Category, name: category, widget: hidden, default: van-trips }
      - { label: Subcategory, name: subcategory, widget: hidden, default: ccc }
      - *f_title
      - *f_arrival
      - *f_departure
      - *f_body
      - *f_trip
      - *f_map
      - *f_address
      - *f_country
      - *f_facilities
      - *f_cost
      - *f_rating
      # CCC only
      - { label: Site type, name: site_type, widget: select, options: [Full, Certified Location] }

  - name: van_camc
    label: "Van Trips: CAMC"
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"
    media_folder: ""
    public_folder: ""
    filter: { field: subcategory, value: camc }
    fields:
      - { label: Category, name: category, widget: hidden, default: van-trips }
      - { label: Subcategory, name: subcategory, widget: hidden, default: camc }
      - *f_title
      - *f_arrival
      - *f_departure
      - *f_body
      - *f_trip
      - *f_map
      - *f_address
      - *f_country
      - *f_facilities
      - *f_cost
      - *f_rating
      # CAMC only
      - { label: Site type, name: site_type, widget: select, options: [Full, Certified Site] }

  - name: van_event
    label: "Van Trips: Event"
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"
    media_folder: ""
    public_folder: ""
    filter: { field: subcategory, value: event }
    fields:
      - { label: Category, name: category, widget: hidden, default: van-trips }
      - { label: Subcategory, name: subcategory, widget: hidden, default: event }
      - *f_title
      - *f_arrival
      - *f_departure
      - *f_body
      - *f_trip
      - *f_map
      - *f_address
      - *f_country
      - *f_facilities
      - *f_cost
      - *f_rating

  - name: van_parkup
    label: "Van Trips: Parkup"
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"
    media_folder: ""
    public_folder: ""
    filter: { field: subcategory, value: parkup }
    fields:
      - { label: Category, name: category, widget: hidden, default: van-trips }
      - { label: Subcategory, name: subcategory, widget: hidden, default: parkup }
      - *f_title
      - *f_arrival
      - *f_departure
      - *f_body
      - *f_trip
      - *f_map
      - *f_address
      - *f_country
      - *f_facilities
      - *f_cost
      - *f_rating

  - name: van_independent
    label: "Van Trips: Independent"
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"
    media_folder: ""
    public_folder: ""
    filter: { field: subcategory, value: independent }
    fields:
      - { label: Category, name: category, widget: hidden, default: van-trips }
      - { label: Subcategory, name: subcategory, widget: hidden, default: independent }
      - *f_title
      - *f_arrival
      - *f_departure
      - *f_body
      - *f_trip
      - *f_map
      - *f_address
      - *f_country
      - *f_facilities
      - *f_cost
      - *f_rating

  # ----------------------------------------------------------------- Holidays
  # Subcategory is a plain visible select here (no extra per-subcategory fields).
  - name: holidays
    label: Holidays
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"
    media_folder: ""
    public_folder: ""
    filter: { field: category, value: holidays }
    fields:
      - { label: Category, name: category, widget: hidden, default: holidays }
      - { label: Subcategory, name: subcategory, widget: select, options: [{label: Beach, value: beach}, {label: Cottage, value: cottage}, {label: Overseas, value: overseas}] }
      - *f_title
      - *f_arrival
      - *f_departure
      - *f_body
      - *f_trip
      - *f_map
      - *f_address
      - *f_country
      - &f_accom { label: Accommodation name, name: accommodation_name, widget: string, required: false }
      - &f_booking { label: Booking ref, name: booking_ref, widget: string, required: false }
      - *f_cost

  # ---------------------------------------------------------------- Ski Trips
  - name: ski_trips
    label: Ski Trips
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"
    media_folder: ""
    public_folder: ""
    filter: { field: category, value: ski-trips }
    fields:
      - { label: Category, name: category, widget: hidden, default: ski-trips }
      - *f_title
      - *f_arrival
      - *f_departure
      - *f_body
      - *f_trip
      - *f_map
      - *f_address
      - *f_country
      - { label: Resort, name: resort, widget: string }
      - { label: Lift pass, name: lift_pass, widget: string, required: false }
      - { label: Piste km, name: piste_km, widget: number, value_type: int, required: false }
      - *f_accom

  # -------------------------------------------------------------- City Breaks
  - name: city_breaks
    label: City Breaks
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{fields.arrival|date('YYYY-MM-DD')}}-{{fields.title}}"
    media_folder: ""
    public_folder: ""
    filter: { field: category, value: city-breaks }
    fields:
      - { label: Category, name: category, widget: hidden, default: city-breaks }
      - *f_title
      - *f_arrival
      - *f_departure
      - *f_body
      - *f_trip
      - *f_map
      - *f_address
      - *f_country
      - *f_accom
      - *f_booking
      - { label: Highlights, name: highlights, widget: list, required: false, field: { label: Highlight, name: highlight, widget: string } }

  # -------------------------------------------------------------------- Trips
  # Overlay, not a category. Posts link to one trip via the optional `trip` relation
  # above, which stores the trip's slug.
  - name: trips
    label: Trips
    folder: content/trips
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Start date, name: start_date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: End date, name: end_date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - { label: Intro, name: body, widget: markdown, editor_components: [image, images, code-block] }

  # -------------------------------------------------------------------- Pages
  # Standalone pages (About etc.). Served at /<title-slug>/; link them from config/_default/menus.toml.
  - name: pages
    label: Pages
    label_singular: Page
    folder: content/pages
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown, editor_components: [image, images, code-block] }
