backend:
  name: github
  repo: gmlogan/loganvantravels
  branch: main

# Saves go to a draft PR branch, not straight to main. Publish (merge) when
# a batch of edits is ready — only then does the site rebuild.
publish_mode: editorial_workflow

media_folder: ''
public_folder: ''

collections:
  - name: pages          # ← added
    label: Pages
    label_singular: Page
    folder: content/pages
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, required: false, hint: "Leave blank to derive from the title" }
      - { label: Body, name: body, widget: markdown }
  - name: posts
    label: Posts
    folder: content/posts
    path: "{{year}}-{{month}}-{{day}}-{{slug}}/index"
    media_folder: ''
    public_folder: ''
    create: true
    slug: "{{slug}}"
    sortable_fields:
      fields: [date, title, wp_published]
      default:
        field: date
        direction: descending
    view_filters:
      - { label: 'Campsite: CCC', field: campsites, pattern: CCC }
      - { label: 'Campsite: CAMC', field: campsites, pattern: CAMC }
      - { label: 'Campsite: Aire', field: campsites, pattern: Aire }
      - { label: 'Campsite: Independent', field: campsites, pattern: Independent }
      - { label: 'Campsite: Pub', field: campsites, pattern: Pub }
      - { label: 'Campsite: Off-Grid', field: campsites, pattern: 'Off-Grid' }
      - { label: 'Campsite: untagged', field: campsites, pattern: '^$' }
    view_groups:
      - { label: 'Campsite type', field: campsites }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Slug, name: slug, widget: string, required: false, hint: "Leave blank to derive from the title" }
      - { label: Original blog date, name: wp_published, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Campsite type, name: campsites, widget: select, required: false,
          options: [CCC, CAMC, Aire, Independent, Pub, Off-Grid] }
      - { label: Map link, name: map, widget: string, required: false,
          hint: "Any Google Maps share link; shows a 'View on map' button on the post" }
      - { label: Trip, name: trips, widget: relation, required: false, multiple: true,
          collection: trips, search_fields: [title], value_field: title, display_fields: [title],
          hint: "Pick from Trips (create the Trip first under the Trips collection)" }
      - { label: Body, name: body, widget: markdown }

  - name: trips
    label: Trips
    label_singular: Trip
    folder: content/trips
    path: '{{slug}}/_index'
    extension: md
    format: frontmatter
    create: true
    media_folder: ''
    public_folder: ''
    slug: '{{slug}}'
    identifier_field: title
    fields:
      - { label: Trip name, name: title, widget: string,
          hint: "Type this same text in a stay's Trip field to attach it" }
      - { label: Summary, name: body, widget: markdown }
