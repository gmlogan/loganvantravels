backend:
  name: github
  repo: gmlogan/loganvantravels
  branch: main

media_folder: ''
public_folder: ''

collections:
  - name: pages          # ← added
    label: Pages
    label_singular: Page
    folder: content/pages
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, required: false, hint: "Leave blank to derive from the title" }
      - { label: Body, name: body, widget: markdown }
  - name: posts
    label: Posts
    folder: content/posts
    path: "{{year}}-{{month}}-{{day}}-{{slug}}/index"
    media_folder: ''
    public_folder: ''
    create: true
    slug: "{{slug}}"
    sortable_fields:
      fields: [date, title, wp_published]
      default:
        field: date
        direction: descending
    view_groups:
      - { label: Category, field: categories }
      - { label: 'Site type', field: site-types }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Slug, name: slug, widget: string, required: false, hint: "Leave blank to derive from the title" }
      - { label: Original blog date, name: wp_published, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Category, name: categories, widget: select, multiple: false, required: true,
          options: [campervan, ski, city-break, holiday] }
      - { label: Site type, name: site-types, widget: select, required: false,
          options: [Aire, CAMC, CCC, Independent, Off-Grid, Pub] }
      - { label: Map link, name: map, widget: string, required: false,
          hint: "Any Google Maps share link; shows a 'View on map' button on the post" }
      - { label: Tags, name: tags, widget: list, required: false,
          hint: "Only fill this in when a run of stays is worth calling out as a trip. Use a consistent lowercase-hyphenated name (e.g. 2026-zell-am-see) and copy/paste it into every stay in that trip rather than retyping it, to avoid near-duplicate trip names." }
      - { label: Body, name: body, widget: markdown }

  - name: trip_pages
    label: Trip pages
    label_singular: Trip page
    folder: content/tags
    path: '{{slug}}/_index'
    extension: md
    format: frontmatter
    create: true
    media_folder: ''
    public_folder: ''
    slug: '{{slug}}'
    identifier_field: title
    fields:
      - { label: Trip name, name: title, widget: string,
          hint: "Must exactly match the trip name used in a stay's Tags field, e.g. 2026-north-east" }
      - { label: Intro, name: body, widget: markdown, required: false }

  - name: category_pages
    label: Category pages
    label_singular: Category page
    folder: content/categories
    path: '{{slug}}/_index'
    extension: md
    format: frontmatter
    create: true
    media_folder: ''
    public_folder: ''
    slug: '{{slug}}'
    identifier_field: title
    fields:
      - { label: Category name, name: title, widget: string,
          hint: "Must exactly match one of the Category options on a post: campervan, ski, city-break, holiday" }
      - { label: Intro, name: body, widget: markdown, required: false }

  - name: site_type_pages
    label: Site type pages
    label_singular: Site type page
    folder: content/site-types
    path: '{{slug}}/_index'
    extension: md
    format: frontmatter
    create: true
    media_folder: ''
    public_folder: ''
    slug: '{{slug}}'
    identifier_field: title
    fields:
      - { label: Site type name, name: title, widget: string,
          hint: "Must exactly match one of the Site type options on a post: Aire, CAMC, CCC, Independent, Off-Grid, Pub" }
      - { label: Intro, name: body, widget: markdown, required: false }
